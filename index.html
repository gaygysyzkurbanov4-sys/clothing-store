<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clothing Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--ink:#08090b;--bone:#efece6;--steel:#8e9aa6;--line:#23262b;--hot:#ff4a1c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--bone);font-family:'Archivo',system-ui,sans-serif;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.d{font-stretch:62%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.88}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;mix-blend-mode:difference;color:#fff}
.logo{font-stretch:62%;font-weight:900;font-size:26px;text-transform:uppercase}
nav{display:flex;gap:20px;font-size:15px}
nav button{font-weight:600}
.hero{position:relative;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:90px 20px 24px}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
.slide.on{opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--ink) 4%,transparent 55%),linear-gradient(90deg,rgba(8,9,11,.8),transparent 70%)}
.hero>*{position:relative;z-index:2}
#hT{font-size:clamp(64px,19vw,230px)}
#hS{color:var(--steel);font-size:18px;margin:14px 0 4px}
.sl{display:flex;gap:8px;margin-top:10px}
.sl button{width:38px;height:38px;border:1px solid #3a3e45;border-radius:50%}
#rw{perspective:1100px;height:310px;position:relative;touch-action:pan-y;cursor:grab;margin-top:6px;overflow:hidden}
#ring{position:absolute;left:50%;top:30px;width:0;height:0;transform-style:preserve-3d}
.rc{position:absolute;width:140px;height:190px;left:-70px;top:0;background:#222 center/cover;border-radius:4px;border:1px solid rgba(255,255,255,.18);backface-visibility:hidden;text-align:left}
.rc span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;font-size:13px;font-weight:600;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
section{padding:56px 0}
h2{font-size:clamp(38px,9vw,84px);padding:0 20px;margin-bottom:24px}
.panels{display:flex;gap:8px;overflow-x:auto;padding:0 20px 8px;scroll-snap-type:x mandatory}
.pn{flex:0 0 min(46vw,250px);height:400px;background:#1a1c20 center/cover;position:relative;border-radius:4px;scroll-snap-align:start;text-align:left;transition:flex-basis .35s}
.pn::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent 60%)}
.pn span{position:absolute;left:14px;bottom:16px;z-index:1;font-stretch:62%;font-weight:900;font-size:32px;text-transform:uppercase;line-height:.9}
.pn.on{outline:2px solid var(--bone)}
@media(hover:hover){.pn:hover{flex-basis:340px}}
.light{background:var(--bone);color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px;margin-bottom:20px}
.bar input,.bar select{background:#fff;border:1px solid #cfcac0;border-radius:4px;padding:11px 12px;flex:1;min-width:140px;color:var(--ink)}
.bar button{border:1px solid var(--ink);border-radius:4px;padding:11px 14px;font-weight:600}
.bar button.on{background:var(--ink);color:var(--bone)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 10px;padding:0 20px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative}
.card .im{display:block;width:100%;aspect-ratio:3/4;background:#d9d4c9 center/cover;position:relative}
.tag{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bone);font-size:12px;font-weight:700;padding:3px 9px}
.hrt{position:absolute;right:6px;top:6px;width:36px;height:36px;font-size:20px;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.7)}
.hrt.on{color:var(--hot)}
.card .in{padding-top:8px;font-size:15px}
.card h3{font-size:15px;font-weight:600}
.card s{color:#837e73;margin-left:8px;font-size:13px}
.empty{padding:20px;color:#6d685e}
.journal{display:grid;gap:12px;padding:0 20px;grid-template-columns:1fr}
@media(min-width:800px){.journal{grid-template-columns:repeat(3,1fr)}}
.post .im{aspect-ratio:5/3;background:#222 center/cover}
.post h3{font-size:17px;margin-top:10px}.post small{color:var(--steel)}
footer{border-top:1px solid var(--line);padding:30px 20px;color:var(--steel);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ov{position:fixed;inset:0;z-index:40;display:none;overflow:auto}
.ov.on{display:block}
#cov{background:rgba(0,0,0,.6)}
#pp{background:var(--bone);color:var(--ink)}
.pg{display:grid;gap:0;max-width:1100px;margin:0 auto;padding:70px 20px 40px}
@media(min-width:800px){.pg{grid-template-columns:1.1fr 1fr;gap:40px}}
.pg .big{width:100%;aspect-ratio:3/4;object-fit:cover;background:#d9d4c9}
.v360{width:100%;aspect-ratio:1/1;background:#d9d4c9 no-repeat;touch-action:pan-y;cursor:grab;user-select:none}
.th{display:flex;gap:8px;margin-top:8px;align-items:center}.th img{width:60px;height:78px;object-fit:cover;opacity:.55;cursor:pointer}.th img.on{opacity:1;outline:2px solid var(--ink)}
.pg h1{font-size:clamp(40px,8vw,72px);margin-bottom:10px}
.pp{font-size:24px;font-weight:700;margin-bottom:16px}.pp s{font-size:16px;color:#837e73;font-weight:400;margin-left:10px}
.lb{font-weight:700;margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:48px;padding:10px 14px;border:1px solid var(--ink);text-align:center}
.opt.on{background:var(--ink);color:var(--bone)}
.buy{display:block;width:100%;background:var(--hot);color:#fff;font-weight:800;font-size:18px;padding:16px;margin-top:22px}
.buy:disabled{background:#999}
.px{position:fixed;right:14px;top:12px;z-index:5;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bone);font-size:22px}
.rel{max-width:1100px;margin:0 auto;padding:0 20px 50px}
.rel .grid{padding:0}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(430px,100vw);background:var(--bone);color:var(--ink);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;border-bottom:1px solid #cfcac0;padding-bottom:12px}
.item img{width:64px;height:84px;object-fit:cover}
.qty{display:flex;gap:10px;align-items:center;margin-top:6px}.qty button{width:28px;height:28px;border:1px solid var(--ink)}
.drawer input,.drawer textarea{width:100%;background:#fff;border:1px solid #cfcac0;padding:12px;color:var(--ink)}
.wa{background:#25d366;color:#04230f;font-weight:800;padding:15px;width:100%}
.msg{color:#6d685e;font-size:14px}.err{color:#b3261e}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="logo" id="logo">Clothing Store</div><nav><button id="savedBtn">Saved (0)</button><button id="cartBtn">Cart (0)</button></nav></header>

<div class="hero" id="hero">
  <h1 class="d" id="hT">New Collection</h1>
  <p id="hS">Winter 2026</p>
  <div class="sl"><button id="prev" aria-label="Previous slide">&lsaquo;</button><button id="next" aria-label="Next slide">&rsaquo;</button></div>
  <div id="rw"><div id="ring"></div></div>
</div>

<section><h2 class="d">Shop by category</h2><div class="panels" id="panels"></div></section>

<section class="light" id="shop">
  <h2 class="d" id="shopTitle">Collection</h2>
  <div class="bar"><input id="q" type="search" placeholder="Search products" aria-label="Search products"><select id="sort" aria-label="Sort"><option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select><button id="onlySaved">Saved only</button></div>
  <div class="grid" id="grid"></div><p class="empty" id="loadMsg">Loading products...</p>
</section>

<section id="journal"><h2 class="d">Journal</h2><div class="journal" id="jList"></div></section>
<footer><span id="foot">&copy; 2026 Clothing Store</span><span>Orders are confirmed on WhatsApp</span></footer>

<div class="ov" id="pp"></div>
<div class="ov" id="cov"><div class="drawer" id="drawer"></div></div>

<script>
const U='https://ginmgbridtzowrmwdlyw.supabase.co/rest/v1/';
const K='sb_publishable_nKOV7H8wRxf8LAc-wrOdwQ_deoEbWmT';
const H={apikey:K,'Content-Type':'application/json'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>'\u20AC'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const get=async p=>{const r=await fetch(U+p,{headers:H});if(!r.ok)throw new Error(r.status);return r.json()};
const ls={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=[],C=[],S={},slides=[],si=0,cat=0,q='',sort='new',only=false,fav=ls.get('fav',[]),cart=ls.get('cart',[]),sel={};
const img0=p=>esc((p.images||[])[0]||'');

async function init(){
  try{
    const [s,h,c,p,j]=await Promise.all([get('settings?select=*'),get('hero_slides?select=*&order=sort'),get('categories?select=*&order=sort'),get('products?select=*&order=created_at.desc'),get('journal_posts?select=*&order=post_date.desc')]);
    s.forEach(x=>S[x.key]=x.value);P=p;C=c;slides=h;
    if(S.store_name){$('#logo').textContent=S.store_name;document.title=S.store_name;$('#foot').innerHTML='&copy; 2026 '+esc(S.store_name)}
    hero();ring();panels();grid();
    $('#jList').innerHTML=j.map(x=>'<article class="post"><div class="im" style="background-image:url(\''+esc(x.image_url)+'\')"></div><h3>'+esc(x.title)+'</h3><small>'+esc(x.post_date)+'</small></article>').join('');
    $('#loadMsg').textContent='';
  }catch(e){$('#loadMsg').textContent='Could not load products. Please refresh the page.';$('#loadMsg').className='empty err'}
  count();
}
function hero(){
  slides.forEach((x,i)=>{const d=document.createElement('div');d.className='slide'+(i?'':' on');d.style.backgroundImage="url('"+x.image_url+"')";$('#hero').prepend(d)});
  slide(0);
}
function slide(i){if(!slides.length)return;si=(i+slides.length)%slides.length;$$('.slide').forEach((e,k)=>e.classList.toggle('on',k===si));$('#hT').textContent=slides[si].title;$('#hS').textContent=slides[si].subtitle||''}
$('#prev').onclick=()=>slide(si-1);$('#next').onclick=()=>slide(si+1);
setInterval(()=>{if(!matchMedia('(prefers-reduced-motion:reduce)').matches)slide(si+1)},7000);

function ring(){
  let l=P.filter(p=>p.is_featured);if(l.length<3)l=P.slice(0,8);if(!l.length){$('#rw').style.display='none';return}
  while(l.length<6)l=l.concat(l);
  const n=l.length,R=Math.round(Math.max(190,n*36)),el=$('#ring'),w=$('#rw');
  el.innerHTML=l.map((p,i)=>'<button class="rc" data-id="'+p.id+'" style="transform:rotateY('+(i*360/n)+'deg) translateZ('+R+'px);background-image:url(\''+img0(p)+'\')"><span>'+esc(p.name)+'</span></button>').join('');
  let a=0,dr=false,x0=0,mv=0;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  w.onpointerdown=e=>{dr=true;x0=e.clientX;mv=0};
  addEventListener('pointerup',()=>dr=false);
  w.onpointermove=e=>{if(!dr)return;const dx=e.clientX-x0;x0=e.clientX;mv+=Math.abs(dx);a+=dx*.4};
  w.onclick=e=>{const b=e.target.closest('.rc');if(b&&mv<6)openP(+b.dataset.id)};
  (function t(){if(!dr&&!rm)a+=.12;el.style.transform='translateZ(-'+R+'px) rotateY('+a+'deg)';requestAnimationFrame(t)})();
}
function panels(){
  $('#panels').innerHTML='<button class="pn'+(cat===0?' on':'')+'" data-c="0"><span>All</span></button>'+C.map(c=>'<button class="pn'+(cat===c.id?' on':'')+'" data-c="'+c.id+'" style="background-image:url(\''+esc(c.image_url)+'\')"><span>'+esc(c.name)+'</span></button>').join('');
  $$('.pn').forEach(b=>b.onclick=()=>{cat=+b.dataset.c;panels();grid();$('#shop').scrollIntoView()});
}
function card(p){
  const d=p.old_price?Math.round((1-p.price/p.old_price)*100):0;
  return '<article class="card"><button class="im" data-id="'+p.id+'" style="background-image:url(\''+img0(p)+'\')" aria-label="'+esc(p.name)+'">'+(p.stock<=0?'<span class="tag">Sold out</span>':p.sprite360?'<span class="tag">360&deg;</span>':d>0?'<span class="tag">-'+d+'%</span>':p.is_new?'<span class="tag">New</span>':'')+'</button><button class="hrt'+(fav.includes(p.id)?' on':'')+'" data-f="'+p.id+'" aria-label="Save">&#9829;</button><div class="in"><h3>'+esc(p.name)+'</h3><div>'+eur(p.price)+(p.old_price?'<s>'+eur(p.old_price)+'</s>':'')+'</div></div></article>';
}
function bindCards(root){
  root.querySelectorAll('.im').forEach(b=>b.onclick=()=>openP(+b.dataset.id));
  root.querySelectorAll('.hrt').forEach(b=>b.onclick=()=>{const id=+b.dataset.f;fav=fav.includes(id)?fav.filter(x=>x!==id):fav.concat(id);ls.set('fav',fav);count();b.classList.toggle('on');if(only)grid()});
}
function grid(){
  let l=P.filter(p=>(!cat||p.category_id===cat)&&(!only||fav.includes(p.id))&&(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q)));
  l=l.slice().sort((a,b)=>sort==='lo'?a.price-b.price:sort==='hi'?b.price-a.price:0);
  const cn=C.find(c=>c.id===cat);$('#shopTitle').textContent=cn?cn.name:'Collection';
  $('#grid').innerHTML=l.length?l.map(card).join(''):'<p class="empty">Nothing matches. Try another search or category.</p>';
  bindCards($('#grid'));
}
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();grid()};
$('#sort').onchange=e=>{sort=e.target.value;grid()};
$('#onlySaved').onclick=e=>{only=!only;e.target.classList.toggle('on',only);grid()};
$('#savedBtn').onclick=()=>{only=true;$('#onlySaved').classList.add('on');grid();$('#shop').scrollIntoView()};
function count(){$('#cartBtn').textContent='Cart ('+cart.reduce((s,x)=>s+x.q,0)+')';$('#savedBtn').textContent='Saved ('+fav.length+')'}

function openP(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  sel={p,img:0,color:(p.colors||[])[0]||'',size:(p.sizes||[])[0]||''};drawP();$('#pp').classList.add('on');$('#pp').scrollTop=0;
}
function drawP(){
  const {p}=sel,im=p.images||[],rel=P.filter(x=>x.category_id===p.category_id&&x.id!==p.id).slice(0,4);
  $('#pp').innerHTML='<button class="px" id="px" aria-label="Close">&times;</button><div class="pg"><div>'+(p.sprite360&&sel.mode!=='photo'?'<div class="v360" id="v360" style="background-image:url(\''+esc(p.sprite360)+'\')" role="img" aria-label="360 degree view of '+esc(p.name)+'"></div>':'<img class="big" src="'+esc(im[sel.img])+'" alt="'+esc(p.name)+'">')+'<div class="th">'+(p.sprite360?'<button class="opt'+(sel.mode!=='photo'?' on':'')+'" id="m360">360&deg; view</button>':'')+(im.length>1?im.map((u,i)=>'<img data-i="'+i+'" class="'+(i===sel.img?'on':'')+'" src="'+esc(u)+'" alt="">').join(''):'')+'</div></div><div><h1 class="d">'+esc(p.name)+'</h1><div class="pp">'+eur(p.price)+(p.old_price?'<s>'+eur(p.old_price)+'</s>':'')+'</div><p>'+esc(p.description)+'</p>'+
  ((p.colors||[]).length?'<div class="lb">Color</div><div class="opts">'+p.colors.map(c=>'<button class="opt'+(c===sel.color?' on':'')+'" data-k="color" data-v="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+
  ((p.sizes||[]).length?'<div class="lb">Size</div><div class="opts">'+p.sizes.map(c=>'<button class="opt'+(c===sel.size?' on':'')+'" data-k="size" data-v="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+
  '<button class="buy" id="add"'+(p.stock>0?'':' disabled')+'>'+(p.stock>0?'Add to cart':'Sold out')+'</button></div></div>'+(rel.length?'<div class="rel"><h2 class="d" style="padding:0;font-size:40px">You may also like</h2><div class="grid">'+rel.map(card).join('')+'</div></div>':'');
  $('#px').onclick=()=>$('#pp').classList.remove('on');
  $$('.th img').forEach(i=>i.onclick=()=>{sel.img=+i.dataset.i;sel.mode='photo';drawP()});
  const m3=$('#m360');if(m3)m3.onclick=()=>{sel.mode='360';drawP()};
  spin();
  $$('#pp .opt').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=b.dataset.v;drawP()});
  bindCards($('#pp'));
  const a=$('#add');if(a)a.onclick=()=>{
    const k=p.id+'|'+sel.color+'|'+sel.size,f=cart.find(x=>x.k===k);
    if(f)f.q++;else cart.push({k,id:p.id,name:p.name,price:p.price,color:sel.color,size:sel.size,img:(p.images||[])[0],q:1});
    ls.set('cart',cart);count();$('#pp').classList.remove('on');openCart();
  };
}

function spin(){
  const el=$('#v360');if(!el)return;
  const N=24,C=6,R=4;let f=0,dr=false,x0=0,used=false;
  el.style.backgroundSize=(C*100)+'% '+(R*100)+'%';
  const show=()=>{const i=((Math.round(f)%N)+N)%N;el.style.backgroundPosition=((i%C)*100/(C-1))+'% '+(Math.floor(i/C)*100/(R-1))+'%'};
  show();
  el.onpointerdown=e=>{dr=used=true;x0=e.clientX;el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(!dr)return;f+=(e.clientX-x0)/10;x0=e.clientX;show()};
  el.onpointerup=el.onpointercancel=()=>{dr=false};
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)(function t(){if(!el.isConnected)return;if(!used){f+=.1;show()}requestAnimationFrame(t)})();
}
const total=()=>cart.reduce((s,x)=>s+x.price*x.q,0);
function openCart(){drawCart();$('#cov').classList.add('on')}
function drawCart(m){
  $('#drawer').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="d" style="padding:0;margin:0;font-size:44px">Your cart</h2><button id="cx" aria-label="Close" style="font-size:30px">&times;</button></div>'+
  (cart.length?cart.map((x,i)=>'<div class="item"><img src="'+esc(x.img)+'" alt=""><div style="flex:1"><b>'+esc(x.name)+'</b><div class="msg">'+esc(x.color)+(x.size?' / '+esc(x.size):'')+'</div><div class="qty"><button data-i="'+i+'" data-d="-1" aria-label="Less">&minus;</button>'+x.q+'<button data-i="'+i+'" data-d="1" aria-label="More">+</button></div></div><b>'+eur(x.price*x.q)+'</b></div>').join('')+
  '<div style="display:flex;justify-content:space-between;font-size:20px"><b>Total</b><b>'+eur(total())+'</b></div><input id="cn" placeholder="Full name" autocomplete="name"><input id="cp" placeholder="Phone number" autocomplete="tel" inputmode="tel"><textarea id="ca" rows="2" placeholder="Delivery address"></textarea><button class="wa" id="order">Order on WhatsApp</button><p class="msg '+(m&&m.err?'err':'')+'">'+esc(m?m.t:'We confirm your order and delivery on WhatsApp.')+'</p>':'<p class="msg">Your cart is empty.</p>');
  $('#cx').onclick=()=>$('#cov').classList.remove('on');
  $$('.qty button').forEach(b=>b.onclick=()=>{const it=cart[+b.dataset.i];it.q+=+b.dataset.d;if(it.q<1)cart.splice(+b.dataset.i,1);ls.set('cart',cart);count();drawCart()});
  const o=$('#order');if(o)o.onclick=order;
}
$('#cartBtn').onclick=openCart;
$('#cov').onclick=e=>{if(e.target.id==='cov')$('#cov').classList.remove('on')};
async function order(){
  const n=$('#cn').value.trim(),ph=$('#cp').value.trim(),ad=$('#ca').value.trim();
  if(!n||!ph||!ad){drawCart({t:'Enter your name, phone and address.',err:1});$('#cn').value=n;$('#cp').value=ph;$('#ca').value=ad;return}
  $('#order').disabled=true;
  const id=crypto.randomUUID(),t=total();
  try{
    const r=await fetch(U+'orders',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({id,customer_name:n,phone:ph,address:ad,total:t})});
    if(r.ok)await fetch(U+'order_items',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(cart.map(x=>({order_id:id,product_id:x.id,product_name:x.name,price:x.price,color:x.color,size:x.size,quantity:x.q})))});
  }catch(e){}
  const lines=cart.map(x=>'- '+x.name+' ('+x.color+(x.size?', '+x.size:'')+') x'+x.q+' = '+eur(x.price*x.q));
  const text='New order\n'+lines.join('\n')+'\nTotal: '+eur(t)+'\nName: '+n+'\nPhone: '+ph+'\nAddress: '+ad;
  cart=[];ls.set('cart',cart);count();
  location.href='https://wa.me/'+(S.whatsapp_number||'')+'?text='+encodeURIComponent(text);
}
addEventListener('keydown',e=>{if(e.key==='Escape')$$('.ov').forEach(o=>o.classList.remove('on'))});
init();
</script>
