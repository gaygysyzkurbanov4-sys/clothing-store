<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clothing Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--card:#161618;--line:#2a2a2d;--tx:#f2f1ee;--mut:#9a9a9f;--ac:#e8e4da}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Archivo',system-ui,sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
img{display:block;max-width:100%}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(12,12,13,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:22px;letter-spacing:-.02em}
nav{display:flex;gap:18px;align-items:center;font-size:14px;color:var(--mut)}
nav a{color:inherit;text-decoration:none}
.cartbtn{position:relative;background:var(--tx);color:#000;border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px}
.hero{position:relative;height:78vh;min-height:440px;overflow:hidden}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s}
.slide.on{opacity:1}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,12,13,.92) 10%,rgba(12,12,13,.2) 70%),linear-gradient(0deg,var(--bg),transparent 40%)}
.heroTxt{position:absolute;left:20px;right:20px;bottom:14%;z-index:2;max-width:760px}
.heroTxt h1{font-size:clamp(44px,11vw,120px);line-height:.92;font-weight:900;letter-spacing:-.04em}
.heroTxt p{color:var(--mut);margin:14px 0 22px;font-size:18px}
.cta{display:inline-block;background:var(--tx);color:#000;padding:12px 24px;border-radius:99px;font-weight:600;text-decoration:none}
.dots{position:absolute;right:20px;bottom:22px;z-index:3;display:flex;gap:8px;align-items:center}
.dots button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.4)}
section{padding:44px 20px}
h2{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.03em;margin-bottom:20px}
.cats{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.cat{flex:0 0 220px;height:130px;scroll-snap-align:start;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);text-align:left;background:var(--card) center/cover}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent 70%)}
.cat span{position:absolute;left:14px;bottom:12px;z-index:1;font-weight:800;font-size:19px}
.cat.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;text-align:left;border:1px solid var(--line);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .im{position:relative;aspect-ratio:4/5;background:#222 center/cover}
.badge{position:absolute;top:10px;left:10px;background:var(--ac);color:#000;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.card .in{padding:12px 14px 14px}
.card h3{font-size:15px;font-weight:600}
.pr{margin-top:4px;font-weight:800}
.old{color:var(--mut);text-decoration:line-through;font-weight:400;margin-left:8px;font-size:14px}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--mut);margin-right:5px}
.journal{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.journal{grid-template-columns:repeat(3,1fr)}}
.post{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.post .im{aspect-ratio:5/3;background:#222 center/cover}
.post div.t{padding:14px}
.post small{color:var(--mut)}
footer{border-top:1px solid var(--line);padding:30px 20px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:none}
.ov.on{display:block}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,94vw);max-height:92vh;overflow:auto;background:var(--card);border-radius:18px;display:grid;gap:0}
@media(min-width:760px){.modal{grid-template-columns:1fr 1fr}}
.modal .g img{width:100%;aspect-ratio:4/5;object-fit:cover}
.thumbs{display:flex;gap:8px;padding:10px}
.thumbs img{width:56px;height:70px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--ac)}
.modal .info{padding:22px}
.modal h3{font-size:28px;font-weight:800;letter-spacing:-.02em}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.opt{padding:7px 14px;border:1px solid var(--line);border-radius:99px;font-size:14px}
.opt.on{background:var(--tx);color:#000;border-color:var(--tx)}
.x{position:absolute;right:12px;top:10px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);font-size:18px}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--card);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.item img{width:64px;height:80px;object-fit:cover;border-radius:8px}
.qty{display:flex;gap:10px;align-items:center;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font:inherit}
.wa{background:#25d366;color:#04230f;font-weight:800;padding:14px;border-radius:12px;width:100%}
.msg{color:var(--mut);font-size:14px;min-height:20px}
.err{color:#ff8a80}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">Clothing Store</div>
  <nav><a href="#shop">Shop</a><a href="#journal">Journal</a><button class="cartbtn" id="cartBtn">Cart (0)</button></nav>
</header>

<div class="hero" id="hero">
  <div class="heroTxt"><h1 id="hT">New Collection</h1><p id="hS">Winter 2026</p><a class="cta" href="#shop">Shop now</a></div>
  <div class="dots"><button id="prev" aria-label="Previous slide">&lsaquo;</button><button id="next" aria-label="Next slide">&rsaquo;</button></div>
</div>

<section id="cats"><h2>Browse by category</h2><div class="cats" id="catList"></div></section>
<section id="shop"><h2 id="shopTitle">All products</h2><div class="grid" id="grid"></div><p class="msg" id="loadMsg">Loading products...</p></section>
<section id="journal"><h2>Journal</h2><div class="journal" id="jList"></div></section>
<footer><span id="foot">&copy; 2026 Clothing Store</span><span>Orders are confirmed on WhatsApp</span></footer>

<div class="ov" id="pov"><div class="modal" id="modal"></div></div>
<div class="ov" id="cov"><div class="drawer" id="drawer"></div></div>

<script>
const U='https://ginmgbridtzowrmwdlyw.supabase.co/rest/v1/';
const K='sb_publishable_nKOV7H8wRxf8LAc-wrOdwQ_deoEbWmT';
const H={apikey:K,'Content-Type':'application/json'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>'\u20AC'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const get=async p=>{const r=await fetch(U+p,{headers:H});if(!r.ok)throw new Error(r.status);return r.json()};
const colorMap={black:'#111',white:'#fff',navy:'#1b2a49',blue:'#2f5fd0',gray:'#888',grey:'#888',brown:'#6b4a2f',green:'#2f6b3a',red:'#c0392b',beige:'#d8c8a8'};
let P=[],C=[],S={},slides=[],si=0,cat=0,cart=[];
try{cart=JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}};

async function init(){
  try{
    const [s,h,c,p,j]=await Promise.all([get('settings?select=*'),get('hero_slides?select=*&order=sort'),get('categories?select=*&order=sort'),get('products?select=*&order=created_at.desc'),get('journal_posts?select=*&order=post_date.desc')]);
    s.forEach(x=>S[x.key]=x.value);P=p;C=c;slides=h;
    if(S.store_name){$('#logo').textContent=S.store_name;document.title=S.store_name;$('#foot').innerHTML='&copy; 2026 '+esc(S.store_name)}
    renderHero();renderCats();renderGrid();
    $('#jList').innerHTML=j.map(x=>'<article class="post"><div class="im" style="background-image:url(\''+esc(x.image_url)+'\')"></div><div class="t"><small>'+esc(x.post_date)+'</small><h3>'+esc(x.title)+'</h3></div></article>').join('');
    $('#loadMsg').textContent='';
  }catch(e){$('#loadMsg').textContent='Could not load products. Please refresh the page.';$('#loadMsg').className='msg err'}
  updCart();
}
function renderHero(){
  document.querySelectorAll('.slide').forEach(e=>e.remove());
  slides.forEach((x,i)=>{const d=document.createElement('div');d.className='slide'+(i===0?' on':'');d.style.backgroundImage="url('"+x.image_url+"')";$('#hero').prepend(d)});
  showSlide(0);
}
function showSlide(i){
  if(!slides.length)return;si=(i+slides.length)%slides.length;
  const el=document.querySelectorAll('.slide');el.forEach((e,k)=>e.classList.toggle('on',k===si));
  $('#hT').textContent=slides[si].title;$('#hS').textContent=slides[si].subtitle||'';
}
$('#prev').onclick=()=>showSlide(si-1);$('#next').onclick=()=>showSlide(si+1);
setInterval(()=>{if(!matchMedia('(prefers-reduced-motion:reduce)').matches)showSlide(si+1)},6000);

function renderCats(){
  const all='<button class="cat'+(cat===0?' on':'')+'" data-c="0"><span>All</span></button>';
  $('#catList').innerHTML=all+C.map(c=>'<button class="cat'+(cat===c.id?' on':'')+'" data-c="'+c.id+'" style="background-image:url(\''+esc(c.image_url)+'\')"><span>'+esc(c.name)+'</span></button>').join('');
  document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=+b.dataset.c;renderCats();renderGrid();$('#shop').scrollIntoView()});
}
function dots(cols){return (cols||[]).map(c=>'<span class="dotc" style="background:'+(colorMap[String(c).toLowerCase()]||'#555')+'" title="'+esc(c)+'"></span>').join('')}
function renderGrid(){
  const list=cat?P.filter(p=>p.category_id===cat):P;
  const cn=C.find(c=>c.id===cat);
  $('#shopTitle').textContent=cn?cn.name:'All products';
  $('#grid').innerHTML=list.length?list.map(p=>'<button class="card" data-id="'+p.id+'"><div class="im" style="background-image:url(\''+esc((p.images||[])[0])+'\')">'+(p.is_new?'<span class="badge">New</span>':'')+'</div><div class="in"><h3>'+esc(p.name)+'</h3><div class="pr">'+eur(p.price)+(p.old_price?'<span class="old">'+eur(p.old_price)+'</span>':'')+'</div><div style="margin-top:6px">'+dots(p.colors)+'</div></div></button>').join(''):'<p class="msg">No products in this category yet.</p>';
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>openProduct(+b.dataset.id));
}

let sel={};
function openProduct(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  sel={p,img:0,color:(p.colors||[])[0]||'',size:(p.sizes||[])[0]||''};
  drawProduct();$('#pov').classList.add('on');
}
function drawProduct(){
  const {p}=sel,im=p.images||[];
  $('#modal').innerHTML='<button class="x" id="px" aria-label="Close">&times;</button><div class="g"><img src="'+esc(im[sel.img])+'" alt="'+esc(p.name)+'"><div class="thumbs">'+im.map((u,i)=>'<img data-i="'+i+'" class="'+(i===sel.img?'on':'')+'" src="'+esc(u)+'" alt="">').join('')+'</div></div><div class="info"><h3>'+esc(p.name)+'</h3><div class="pr" style="font-size:22px;margin:6px 0 14px">'+eur(p.price)+(p.old_price?'<span class="old">'+eur(p.old_price)+'</span>':'')+'</div><p style="color:var(--mut);margin-bottom:16px">'+esc(p.description)+'</p>'+
  ((p.colors||[]).length?'<b>Color</b><div class="opts">'+p.colors.map(c=>'<button class="opt'+(c===sel.color?' on':'')+'" data-k="color" data-v="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+
  ((p.sizes||[]).length?'<b>Size</b><div class="opts">'+p.sizes.map(c=>'<button class="opt'+(c===sel.size?' on':'')+'" data-k="size" data-v="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+
  (p.stock>0?'<p class="msg">'+p.stock+' in stock</p><button class="cta" id="add" style="width:100%;text-align:center">Add to cart</button>':'<p class="msg err">Out of stock</p>')+'</div>';
  $('#px').onclick=()=>$('#pov').classList.remove('on');
  document.querySelectorAll('.thumbs img').forEach(i=>i.onclick=()=>{sel.img=+i.dataset.i;drawProduct()});
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=b.dataset.v;drawProduct()});
  const a=$('#add');if(a)a.onclick=()=>{
    const k=p.id+'|'+sel.color+'|'+sel.size,f=cart.find(x=>x.k===k);
    if(f)f.q++;else cart.push({k,id:p.id,name:p.name,price:p.price,color:sel.color,size:sel.size,img:(p.images||[])[0],q:1});
    save();updCart();$('#pov').classList.remove('on');openCart();
  };
}
$('#pov').onclick=e=>{if(e.target.id==='pov')$('#pov').classList.remove('on')};

const total=()=>cart.reduce((s,x)=>s+x.price*x.q,0);
function updCart(){$('#cartBtn').textContent='Cart ('+cart.reduce((s,x)=>s+x.q,0)+')'}
function openCart(){drawCart();$('#cov').classList.add('on')}
function drawCart(msg){
  $('#drawer').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:26px">Your cart</h2><button id="cx" aria-label="Close" style="font-size:26px">&times;</button></div>'+
  (cart.length?cart.map((x,i)=>'<div class="item"><img src="'+esc(x.img)+'" alt=""><div style="flex:1"><b>'+esc(x.name)+'</b><div class="msg" style="min-height:0">'+esc(x.color)+(x.size?' / '+esc(x.size):'')+'</div><div class="qty"><button data-i="'+i+'" data-d="-1" aria-label="Less">&minus;</button>'+x.q+'<button data-i="'+i+'" data-d="1" aria-label="More">+</button></div></div><b>'+eur(x.price*x.q)+'</b></div>').join('')+
  '<div style="display:flex;justify-content:space-between;font-size:20px"><b>Total</b><b>'+eur(total())+'</b></div><input id="cn" placeholder="Full name" autocomplete="name"><input id="cp" placeholder="Phone number" autocomplete="tel" inputmode="tel"><textarea id="ca" rows="2" placeholder="Delivery address"></textarea><button class="wa" id="order">Order on WhatsApp</button><p class="msg '+(msg&&msg.err?'err':'')+'">'+esc(msg?msg.t:'We confirm your order and delivery on WhatsApp.')+'</p>':'<p class="msg">Your cart is empty.</p>');
  $('#cx').onclick=()=>$('#cov').classList.remove('on');
  document.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{const it=cart[+b.dataset.i];it.q+=+b.dataset.d;if(it.q<1)cart.splice(+b.dataset.i,1);save();updCart();drawCart()});
  const o=$('#order');if(o)o.onclick=placeOrder;
}
$('#cartBtn').onclick=openCart;
$('#cov').onclick=e=>{if(e.target.id==='cov')$('#cov').classList.remove('on')};

async function placeOrder(){
  const n=$('#cn').value.trim(),ph=$('#cp').value.trim(),ad=$('#ca').value.trim();
  if(!n||!ph||!ad){drawCart({t:'Please enter your name, phone and address.',err:1});$('#cn').value=n;$('#cp').value=ph;$('#ca').value=ad;return}
  $('#order').disabled=true;
  const id=crypto.randomUUID(),t=total();
  try{
    let r=await fetch(U+'orders',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({id,customer_name:n,phone:ph,address:ad,total:t})});
    if(r.ok)await fetch(U+'order_items',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(cart.map(x=>({order_id:id,product_id:x.id,product_name:x.name,price:x.price,color:x.color,size:x.size,quantity:x.q})))});
  }catch(e){}
  const lines=cart.map(x=>'- '+x.name+' ('+x.color+(x.size?', '+x.size:'')+') x'+x.q+' = '+eur(x.price*x.q));
  const text='New order\n'+lines.join('\n')+'\nTotal: '+eur(t)+'\nName: '+n+'\nPhone: '+ph+'\nAddress: '+ad;
  cart=[];save();updCart();
  location.href='https://wa.me/'+(S.whatsapp_number||'')+'?text='+encodeURIComponent(text);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'))});
init();
</script>
</body>
</html>
